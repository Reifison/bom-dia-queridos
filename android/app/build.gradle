apply plugin: 'com.android.application'

android {
    namespace = "com.bomdiaqueridos.app"
    compileSdk = rootProject.ext.compileSdkVersion

    // Release signing is opt-in and reads credentials only from the local,
    // ignored android/keystore.properties file.
    def signingProperties = new Properties()
    def signingPropertiesFile = rootProject.file('keystore.properties')
    if (signingPropertiesFile.exists()) {
        signingPropertiesFile.withInputStream { signingProperties.load(it) }
    }
    def signingValue = { String propertyName, String envName ->
        signingProperties.getProperty(propertyName) ?: System.getenv(envName)
    }
    def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
    def releaseStorePassword = signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
    def releaseKeyPassword = signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
    def hasReleaseSigning = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
    ].every { it }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.bomdiaqueridos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.4.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Never silently produce an unsigned store bundle when local credentials are absent.
    tasks.configureEach { task ->
        if (task.name in ['preReleaseBuild', 'validateSigningRelease', 'bundleRelease', 'assembleRelease']) {
            task.doFirst {
                if (!hasReleaseSigning) {
                    throw new GradleException('Release signing is required. Configure android/keystore.properties or ANDROID_KEYSTORE_* credentials.')
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // The test-only App Check secret provider must be discovered by the target
    // application's FirebaseApp component runtime, so merge its registrar into
    // the debug app manifest (never the release variant).
    debugImplementation "com.google.firebase:firebase-appcheck-debug-testing:19.0.1"
    androidTestImplementation "com.google.firebase:testlab-instr-lib:0.2"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
