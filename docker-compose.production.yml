services:
  bom-dia-queridos:
    build:
      context: .
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN}
    container_name: bom-dia-queridos
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
